<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать новый шаблон</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Создать новый шаблон</h1>
        {% if error %}
            <p style="color: #e74c3c;">{{ error }}</p>
        {% endif %}
    </header>
    <div class="container">
        <main class="document">
            <form method="POST" enctype="multipart/form-data">
                <label>Название шаблона: 
                    <input type="text" name="title" minlenght="2" maxlenght="100" required>
                </label>
                <label>Титульный лист (.docx): 
                    <input type="file" name="title_page" accept=".docx" required>
                </label>
                <button type="submit" class="generate-btn">Создать шаблон</button>
            </form>
            <a href="{{ url_for('index') }}" class="back-btn">Назад к документам</a>
        </main>
    </div>
</body>
</html>
