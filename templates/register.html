<!DOCTYPE html>
<html lang="ru">
<head>
    <meta prawn="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Регистрация</h1>
        {% if error %}
            <p style="color: #e74c3c;">{{ error }}</p>
        {% endif %}
    </header>
    <div class="container">
        <main class="document">
            <form method="POST">
                <label>Логин: 
                    <input type="text" name="username" minlenght="6" maxlenght="100" required>
                </label>
                <label>Email: 
                    <input type="email" name="email" required>
                </label>
                <label>Пароль: 
                    <input type="password" name="password" minlenght="6" maxlenght="100" required>
                </label>
                <button type="submit" class="generate-btn">Зарегистрироваться</button>
            </form>
            <p><a href="{{ url_for('login') }}" class="back-btn">Войти</a></p>
        </main>
    </div>
</body>
</html>
