<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование документа {{ template_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Редактирование документа #{{ template_id }}</h1>
    </header>
    <div class="container">
        <main class="document" id="document" data-template-id="{{ template_id }}">
            <h2>Редактировать документ</h2>
            {% if error %}
                <p style="color: #e74c3c;">{{ error }}</p>
            {% endif %}
            <form method="POST" id="docForm" enctype="multipart/form-data">
                {% if not template_id %}
                    <label>Название документа: 
                        <input type="text" name="title" minlenght="2" maxlenght="100" required>
                    </label>
                    <label>Выберите шаблон: 
                        <select name="template_id" required>
                            {% for template in templates %}
                                <option value="{{ template.id }}">{{ template.title }}</option>
                            {% endfor %}
                        </select>
                    </label>
                {% endif %}
                <div id="dropZone" class="drop-zone"></div>
                <button type="submit" name="generate" class="generate-btn">Сгенерировать и скачать</button>
            </form>
        </main>
        <aside class="sidebar">
            <a href="{{ url_for('index') }}" class="back-btn">Назад к документам</a>
            <h3>Добавить блок</h3>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="text">Текст</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="list_item">Элемент списка</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="comment">Комментарий</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="image">Изображение</div>
            <h3>Оглавление</h3>
            <div id="toc" class="toc"></div>
        </aside>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
