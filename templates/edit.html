<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование шаблона {{ template_id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Редактирование шаблона {{ template_id }}</h1>
    </header>
    <div class="container">
        <main class="document" id="document">
            <h2>Редактировать шаблон</h2>
            <form method="POST" id="docForm" enctype="multipart/form-data">
                <div class="upload-section">
                    <label>Загрузить титульный лист (DOCX): 
                        <input type="file" name="title_page" accept=".docx">
                    </label>
                </div>
                <div id="dropZone" class="drop-zone"></div>
                <button type="submit" name="generate" class="generate-btn">Сгенерировать документ</button>
            </form>
            <a href="{{ url_for('index') }}" class="back-btn">Вернуться к списку</a>
        </main>
        <aside class="sidebar">
            <h3>Блоки</h3>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="text">Текст</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="table">Таблица</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="numbered_list">Нумерованный список</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="bullet_list">Список с маркерами</div>
            <div class="block-option" draggable="true" ondragstart="drag(event)" data-type="image">Изображение</div>
            <h3>Отступы текста (см)</h3>
            <div class="indent-options">
                <label>Слева: <input type="number" name="indent_left" min="0" step="0.1" value="0"></label>
                <label>Первая строка: <input type="number" name="indent_first_line" min="0" step="0.1" value="0"></label>
                <label>Междустрочный: <input type="number" name="line_spacing" min="0.5" step="0.1" value="1.5"></label>
            </div>
        </aside>
    </div>
    <footer class="footer">
        <p>шавухин мпт.нет есличо</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
	<script>
	    const templateId = "{{ template_id }}";
	    fetch('/get_template/' + templateId)
	        .then(response => response.json())
	        .then(data => {
	            document.querySelector('input[name="indent_left"]').value = data.indent_left || "0";
	            document.querySelector('input[name="indent_first_line"]').value = data.indent_first_line || "0";
	            document.querySelector('input[name="line_spacing"]').value = data.line_spacing || "1.5";

	            data.blocks.forEach((type, index) => {
	                addBlock(type);
	                const block = document.getElementById(`block_${blockCount - 1}`);
	                if (type === "text") {
	                    block.querySelector('.contenteditable').innerHTML = data.contents[index];
	                    block.querySelector(`#content_${block.id}`).value = data.contents[index];
	                    block.querySelector(`#align_${block.id}`).value = data.aligns[index];
	                    block.querySelector(`select[onchange*="align"]`).value = data.aligns[index];
	                } else if (type === "table") {
	                    block.querySelector('textarea').value = data.contents[index];
	                    block.querySelector('input[name="col_widths"]').value = data.col_widths;
	                } else if (type === "numbered_list" || type === "bullet_list") {
	                    block.querySelector('textarea').value = data.contents[index];
	                } else if (type === "image") {
	                    block.querySelector(`#caption_${block.id}`).value = data.captions[index];
	                    if (data.paths[index]) {
	                        block.querySelector(`#preview_${block.id}`).src = '/' + data.paths[index];
	                        block.querySelector(`#preview_${block.id}`).style.display = "block";
	                        block.querySelector(`#image_path_${block.id}`).value = data.paths[index];
	                    }
	                }
	            });
	        })
	        .catch(error => console.error('Ошибка загрузки шаблона:', error));
	</script>
</body>
</html>
