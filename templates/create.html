<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание нового документа</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Создание нового документа</h1>
    </header>
    <div class="container">
        <main class="document">
            <h2>Новый документ</h2>
            <form method="POST">
                <label>Название документа: 
                    <input type="text" name="title" required>
                </label>
                <label>Выберите шаблон (опционально): 
                    <select name="template_id">
                        <option value="">Без шаблона</option>
                        {% for template in templates %}
                            <option value="{{ template.id }}">{{ template.title }}</option>
                        {% endfor %}
                    </select>
                </label>
                <button type="submit" class="generate-btn">Создать</button>
            </form>
            <a href="{{ url_for('index') }}" class="back-btn">Назад к документам</a>
        </main>
    </div>
    <footer class="footer">
        <p>© 2025 Генератор документов</p>
    </footer>
</body>
</html>
